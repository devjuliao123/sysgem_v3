{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1">Instrumentos</h2>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a href="{{ url_for('main.inicio') }}">Início</a></li>
                        <li class="breadcrumb-item active">Instrumentos</li>
                    </ol>
                </nav>
            </div>
            <button class="btn btn-primary d-flex align-items-center" type="button" data-bs-toggle="collapse" data-bs-target="#collapseForm">
                <i class="bi bi-plus-lg me-2"></i> Novo Instrumento
            </button>
        </div>

        <div class="collapse mb-4" id="collapseForm">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form action="{{ url_for('instrumentos.create_instrumento') }}" method="POST" class="row g-3">
                        <div class="col-md-10">
                            <label for="nome" class="form-label small fw-bold text-muted">NOME DO INSTRUMENTO</label>
                            <input type="text" class="form-control" id="nome" name="nome" required placeholder="EX: VIOLÃO, PIANO, ETC.">
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">SALVAR</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="bg-light">
                            <tr>
                                <th class="px-4 py-3 text-muted">ID</th>
                                <th class="py-3">NOME DO INSTRUMENTO</th>
                                <th class="px-4 py-3 text-end">AÇÕES</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for inst in instrumentos %}
                            <tr>
                                <td class="px-4 text-muted small">#{{ inst.id }}</td>
                                <td class="fw-bold">{{ inst.nome }}</td>
                                <td class="px-4 text-end">
                                    <form action="{{ url_for('instrumentos.delete_instrumento', id=inst.id) }}" method="POST" style="display:inline;">
                                        <button type="submit" class="btn btn-outline-danger btn-sm border-0" onclick="return confirm('EXCLUIR ESTE INSTRUMENTO?')">
                                            <i class="bi bi-trash"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="3" class="text-center py-5 text-muted">
                                    <i class="bi bi-music-note fs-1 d-block mb-2 opacity-25"></i>
                                    Nenhum instrumento cadastrado.
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
